name: CI/CD Deploy to Azure

on:
  push:
    branches:
      - deploy_azure
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_ENV_NAME: blazor-app-to-azure

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore CommodityPriceManager.sln

      - name: Build
        run: dotnet build CommodityPriceManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CommodityPriceManager.sln --configuration Release --no-build --verbosity normal

      - name: Install Azure Developer CLI
        uses: azure/setup-azd@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restore AZD environment from single secret
        shell: bash
        run: |
          mkdir -p ".azure/$AZURE_ENV_NAME"
          printf "%s" "${{ secrets.AZD_ENV_FILE }}" > ".azure/$AZURE_ENV_NAME/.env"

      - name: Configure AZD to use Azure CLI auth
        run: azd config set auth.useAzCliAuth "true"

      - name: Select AZD environment
        run: azd env select $AZURE_ENV_NAME

      - name: Inject postgres password for manifest
        run: azd env set postgres_password "${{ secrets.POSTGRES_PASSWORD }}"

      - name: Deploy app only
        env:
          AZD_REMOTE_BUILD: "true"
        run: azd deploy --all --no-prompt
