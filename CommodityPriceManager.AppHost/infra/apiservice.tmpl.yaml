api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: true
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: false
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--sqldb
        value: Host=postgres;Port=5432;Username=postgres;Password={{ securedParameter "postgres_password" }};Database=sqldb
      - name: sqldb-password
        value: '{{ securedParameter "postgres_password" }}'
  template:
    containers:
      - image: {{ .Image }}
        name: apiservice
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: SQLDB_DATABASENAME
            value: sqldb
          - name: SQLDB_HOST
            value: postgres
          - name: SQLDB_JDBCCONNECTIONSTRING
            value: jdbc:postgresql://postgres:5432/sqldb
          - name: SQLDB_PORT
            value: "5432"
          - name: SQLDB_URI
            value: postgresql://postgres:{{ uriEncode (securedParameter "postgres_password" )}}@postgres:5432/sqldb
          - name: SQLDB_USERNAME
            value: postgres
          - name: ConnectionStrings__sqldb
            secretRef: connectionstrings--sqldb
          - name: SQLDB_PASSWORD
            secretRef: sqldb-password
    scale:
      minReplicas: 1
tags:
  azd-service-name: apiservice
  aspire-resource-name: apiservice
